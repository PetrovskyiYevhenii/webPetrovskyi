<!doctype html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <title>Kniznica</title>
    <link rel="stylesheet" href="style.css">
    <script src="app.js" defer></script>
    <script src="knihy.js" defer></script>
</head>
<body>
    <main>
        <h1>Moja kniznica</h1>
        <p id="prihlaseny"></p>

        <form id="formular">
            <input type="text" id="nazov" placeholder="Názov knihy">
            <input type="text" id="autor" placeholder="Autor">
            <input type="number" id="rok" placeholder="Rok">
            <input type="number" step="0.01" id="cena" placeholder="Cena (€)">
            <button type="button" onclick="pridatKnihu()">Pridať knihu</button>
        </form>

        <div id="filterPanel" style="margin: 15px 0;">
            <input type="text" id="hladatInput" placeholder="Hľadať podľa názvu alebo autora">
            <select id="zoraditSelect">
                <option value="id">ID</option>
                <option value="nazov">Názov</option>
                <option value="autor">Autor</option>
                <option value="rok">Rok</option>
                <option value="cena">Cena</option>
            </select>
            <select id="smerSelect">
                <option value="ASC">Vzostupne</option>
                <option value="DESC">Zostupne</option>
            </select>
            <button id="resetFilterBtn" type="button">Zrusit filter</button>
        </div>

        <table border="1" cellpadding="8">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Názov</th>
                    <th>Autor</th>
                    <th>Rok</th>
                    <th>Cena (€)</th>
                    <th>Akcia</th>
                </tr>
            </thead>
            <tbody id="zoznam"></tbody>
        </table>
    </main>
</body>
</html>
